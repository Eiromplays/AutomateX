name: Publish plugin SDK

# Independent of the API release (v*): the SDK versions on its own contract, tagged sdk-v<semver>.
# Publishes via NuGet Trusted Publishing (OIDC) — no stored API key. Requires a matching trusted-publishing
# policy on nuget.org (package owner Eiromplays, repo Eiromplays/AutomateX, workflow publish-sdk.yml).
on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write # OIDC token → short-lived NuGet key (without this the login step silently fails)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Derive version
        run: echo "VERSION=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_ENV"

      - name: Pack
        run: >
          dotnet pack src/AutomateX.Plugin.Sdk/AutomateX.Plugin.Sdk.csproj
          -c Release
          -p:Version="${VERSION}"
          -p:ContinuousIntegrationBuild=true
          -o out

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: Eiromplays

      - name: Push to NuGet
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
