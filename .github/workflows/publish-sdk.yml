name: Publish plugin packages

# Independent of the API release (v*): the plugin SDK + Protocol version on their own contract, tagged
# sdk-v<semver>. Publishes via NuGet Trusted Publishing (OIDC) — no stored API key. One trusted-publishing
# policy on nuget.org (package owner Eiromplays, repo Eiromplays/AutomateX, workflow publish-sdk.yml) covers
# both package ids, since it's scoped to the owner.
on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write # OIDC token → short-lived NuGet key (without this the login step silently fails)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Derive version
        run: echo "VERSION=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_ENV"

      - name: Pack
        run: |
          for project in AutomateX.Plugin.Sdk AutomateX.Plugin.Protocol; do
            dotnet pack "src/$project/$project.csproj" \
              -c Release -p:Version="${VERSION}" -p:ContinuousIntegrationBuild=true -o out
          done

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: Eiromplays

      - name: Push to NuGet
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
