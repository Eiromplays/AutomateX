# Production self-host — GHCR images, restart-on-boot, secrets from .env.
#
#   cp .env.example .env        # then fill it in
#   docker compose -f docker-compose.prod.yml up -d
#
# Update to a newer published version later:
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# Reach it over Tailscale with automatic HTTPS (no ports exposed to the internet):
#   tailscale serve --bg 8080
#   → https://<host>.<tailnet>.ts.net   (use this as PUBLIC_BASE_URL + the OIDC redirect host)
#
# Single node by default (fast, unchanged). For high availability (multiple api replicas) see the HA
# section in docs/deploy-homelab.md — it flips DURABILITY_MODE to Balanced, starts the redis backplane
# (`--profile ha`), scales api, and switches Caddy to sticky sessions. All four together, or not at all.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: automatex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: automatex
    volumes:
      - automatex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automatex"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: a fresh named volume is owned by root, but the API runs as the non-root app user
  # (uid 1654), so it couldn't write uploaded plugins. This chowns the volume once, then exits.
  plugin-init:
    image: alpine:3
    command: ["chown", "-R", "1654:1654", "/app/plugins"]
    volumes:
      - automatex-plugins:/app/plugins
    restart: "no"

  api:
    image: ghcr.io/eiromplays/automatex-api:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__automatex: Host=postgres;Database=automatex;Username=automatex;Password=${POSTGRES_PASSWORD}
      # Required for connection secrets (AES). Losing this makes stored secrets unrecoverable.
      # Generate with: openssl rand -base64 32
      Encryption__Key: "${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}"
      # Public https origin (Tailscale ts.net host) used for webhook URLs + OIDC redirects.
      Engine__PublicBaseUrl: ${PUBLIC_BASE_URL}
      # OIDC browser login. Dynamic API keys (Settings → API keys) work alongside it for scripts.
      # No IdP? Drop these three and set Auth__Bootstrap=true once to mint a first instance admin key.
      Auth__Authority: ${OIDC_AUTHORITY}
      Auth__ClientId: ${OIDC_CLIENT_ID}
      Auth__ClientSecret: ${OIDC_CLIENT_SECRET}
      # In-process, full host trust — leave false unless you're actively uploading plugins.
      Engine__AllowPluginUpload: ${ALLOW_PLUGIN_UPLOAD:-false}
      # Opt-in auto-update: uncomment to keep catalog-installed plugins on the latest compatible,
      # same-major version from a verified source. A TimeSpan (e.g. 01:00:00); needs AllowPluginUpload.
      # Engine__PluginAutoUpdateInterval: ${PLUGIN_AUTO_UPDATE_INTERVAL}
      # SSRF guard: block http.request to private/loopback/link-local targets. Off by default so a
      # local LLM / LAN services work; turn on for internet-exposed instances with no internal targets.
      Engine__BlockPrivateNetworkRequests: ${BLOCK_PRIVATE_NETWORK_REQUESTS:-false}
      # Allowlist for the guard above: comma-separated hostnames/CIDRs that stay reachable while it's on
      # (widens only). Expanded into Engine__EgressAllowlist__N by the app. Empty = all-or-nothing.
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-}
      # Clustering (v5.0). Single node → keep Solo: fast in-process queues, instant execution, unchanged.
      # Running MORE THAN ONE api replica REQUIRES Balanced — it turns on leader election so the singleton
      # workers (cron, plugin triggers, sweepers) run on exactly one node and executions distribute over a
      # shared Postgres queue. ⚠ Solo + replicas = double-fired triggers and duplicate runs. Don't scale
      # this service without setting DURABILITY_MODE=Balanced.
      Engine__DurabilityMode: ${DURABILITY_MODE:-Solo}
      # SignalR backplane for multi-node live updates (execution events + plugin logs). Empty = in-process
      # (single node). For HA point it at the redis service below: REDIS_CONNECTION=redis:6379.
      ConnectionStrings__redis: ${REDIS_CONNECTION:-}
    volumes:
      - automatex-plugins:/app/plugins
    depends_on:
      postgres:
        condition: service_healthy
      plugin-init:
        condition: service_completed_successfully

  web:
    image: ghcr.io/eiromplays/automatex-web:latest
    restart: unless-stopped
    depends_on:
      - api
    # Caddy reverse-proxies /api + /hubs to the api service internally, so the API needs no
    # published port. Only this one is exposed; point Tailscale Serve at it.
    ports:
      - "8080:80"

  # SignalR backplane for HA (multiple api replicas). Only started with the `ha` profile:
  #   docker compose -f docker-compose.prod.yml --profile ha up -d --scale api=2
  # Transient pub/sub only (no persistence needed), reachable only inside the compose network.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["ha"]

volumes:
  automatex-postgres-data:
  automatex-plugins:
